<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Animación - Saludo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            color: white;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .npc-container {
            text-align: center;
        }
        .npc-image {
            width: 250px; 
            /* El punto de origen de la rotación es la parte inferior central (los pies) */
            transform-origin: bottom center; 
            /* Se aplica la animación 'saludo' repetida infinitamente */
            animation: saludo 2.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* Keyframes para simular un saludo alegre de todo el cuerpo */
        @keyframes saludo {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(12deg) translateY(-10px); }
            20% { transform: rotate(-8deg) translateY(-5px); }
            30% { transform: rotate(12deg) translateY(-10px); }
            40% { transform: rotate(-8deg) translateY(-5px); }
            50% { transform: rotate(0deg) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="npc-container">
        <h2>Animación de Saludo NPC</h2>
        <img src="base-idle.png" alt="NPC Base" class="npc-image">
        <p>Animación CSS aplicada sobre la imagen entera.</p>
    </div>
</body>
</html>

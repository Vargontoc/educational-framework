<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%">
  <defs>
    <!-- avatar-1 -->
    <symbol id="avatar-1" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#F97316" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🦊</text>
    </symbol>

    <!-- avatar-2 -->
    <symbol id="avatar-2" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#A78BFA" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🐱</text>
    </symbol>

    <!-- avatar-3 -->
    <symbol id="avatar-3" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#60A5FA" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🐶</text>
    </symbol>

    <!-- avatar-4 -->
    <symbol id="avatar-4" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#FBBF24" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🦁</text>
    </symbol>

    <!-- avatar-5 -->
    <symbol id="avatar-5" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#6B7280" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🐼</text>
    </symbol>

    <!-- avatar-6 -->
    <symbol id="avatar-6" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#34D399" />
      <text x="50" y="50" font-size="45" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">🐨</text>
    </symbol>
  </defs>

  <!-- Renderizado de los avatares para previsualización -->
  <use href="#avatar-1" x="0" y="0" width="100" height="100" />
  <use href="#avatar-2" x="100" y="0" width="100" height="100" />
  <use href="#avatar-3" x="200" y="0" width="100" height="100" />
  <use href="#avatar-4" x="300" y="0" width="100" height="100" />
  <use href="#avatar-5" x="400" y="0" width="100" height="100" />
  <use href="#avatar-6" x="500" y="0" width="100" height="100" />
</svg>

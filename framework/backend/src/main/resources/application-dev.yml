spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  liquibase:
    drop-first: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[es.vargontoc]": DEBUG
    "[org.springframework.ai]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql]": TRACE

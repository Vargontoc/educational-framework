server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL}
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[es.vargontoc]": ${LOGGING_LEVEL_ES_VARGONTOC}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  session:
    default-heartbeat-interval-seconds: 30
    heartbeat-grace-multiplier: 2
    retention-days: 30
    scheduling:
      enabled: ${APP_SESSION_SCHEDULING_ENABLED}

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,heapdump,info
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    path: ${LOG_FILE_PATH:logs}
  level:
    "[es.vargontoc]": ${LOGGING_LEVEL_ES_VARGONTOC:INFO}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}
  session:
    default-heartbeat-interval-seconds: 30
    heartbeat-grace-multiplier: 2
    retention-days: 30
    scheduling:
      enabled: ${APP_SESSION_SCHEDULING_ENABLED:true}
  tts:
    base-url: ${TTS_BASE_URL:http://localhost:8081}
    timeout-ms: ${TTS_TIMEOUT_MS:5000}
    enabled: ${TTS_ENABLED:true}
  avatar:
    cache:
      enabled: ${AVATAR_CACHE_ENABLED:true}
      max-entries: ${AVATAR_CACHE_MAX_ENTRIES:1024}
      expire-after-write-minutes: ${AVATAR_CACHE_EXPIRE_MINUTES:60}
      disk-path: ${AVATAR_CACHE_DISK_PATH:cache/avatar-audio}
      max-disk-entries: ${AVATAR_CACHE_MAX_DISK_ENTRIES:4096}
      audio-format-version: ${AVATAR_CACHE_FORMAT_VERSION:1}

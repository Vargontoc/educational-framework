server:
  port: ${SERVER_PORT:8080}

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  jackson2:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  
  ai:
    model:
      chat: ollama
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,heapdump,info
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    path: ${LOG_FILE_PATH:logs}
  level:
    "[es.vargontoc]": ${LOGGING_LEVEL_ES_VARGONTOC:INFO}
    "[org.springframework.ai]": DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost, http://192.168.1.33}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  tracking:
    adaptive-difficulty:
      sliding-window-attempts: ${APP_TRACKING_AD_SLIDING_WINDOW:10}
      increase-threshold-percent: ${APP_TRACKING_AD_INCREASE_THRESHOLD:75}
      decrease-threshold-percent: ${APP_TRACKING_AD_DECREASE_THRESHOLD:40}
      min-attempts-before-change: ${APP_TRACKING_AD_MIN_ATTEMPTS:5}
      cooldown-attempts: ${APP_TRACKING_AD_COOLDOWN:3}
      target-response-time-ms: ${APP_TRACKING_AD_TARGET_RESPONSE_MS:5000}
      timeout-rate-threshold-percent: ${APP_TRACKING_AD_TIMEOUT_THRESHOLD:30}
      timeout-penalty-weight: ${APP_TRACKING_AD_TIMEOUT_PENALTY:0.3}
      accuracy-weight: ${APP_TRACKING_AD_ACCURACY_WEIGHT:0.7}
      speed-weight: ${APP_TRACKING_AD_SPEED_WEIGHT:0.3}
    number-unlock:
      min-success-rate-percent: ${APP_TRACKING_NUMBER_UNLOCK_MIN_SUCCESS_RATE:80}
      min-attempts-per-category: ${APP_TRACKING_NUMBER_UNLOCK_MIN_ATTEMPTS:10}
  session:
    default-heartbeat-interval-seconds: 30
    heartbeat-grace-multiplier: 2
    retention-days: 30
    scheduling:
      enabled: ${APP_SESSION_SCHEDULING_ENABLED:true}
  tts:
    base-url: ${TTS_BASE_URL:http://localhost:8081}
    timeout-ms: ${TTS_TIMEOUT_MS:5000}
    enabled: ${TTS_ENABLED:true}
  telegram:
    bot:
      name: ${TELEGRAM_BOT:}
      token: ${TELEGRAM_TOKEN:}
  avatar:
    cache:
      enabled: ${AVATAR_CACHE_ENABLED:true}
      max-entries: ${AVATAR_CACHE_MAX_ENTRIES:1024}
      expire-after-write-minutes: ${AVATAR_CACHE_EXPIRE_MINUTES:60}
      disk-path: ${AVATAR_CACHE_DISK_PATH:cache/avatar-audio}
      max-disk-entries: ${AVATAR_CACHE_MAX_DISK_ENTRIES:4096}
      audio-format-version: ${AVATAR_CACHE_FORMAT_VERSION:1}

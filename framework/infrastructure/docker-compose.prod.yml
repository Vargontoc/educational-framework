
networks:
  # In prod, rename the internal network so dev and prod stacks can run
  # simultaneously on the same host without network name collision.
  # Services still reference 'educational-network-dev' as the compose key;
  # Docker creates the actual bridge as 'educational-network'.
  educational-network-dev: !override
    name: educational-network
    driver: bridge

services:
  ollama-educational:
    deploy:
      restart_policy:
        condition: on-failure
    runtime: nvidia
    volumes:
      - ollama_models:/models
    ports: !reset []

  postgres-educational:
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: !reset []

  coqui-educational:
    runtime: nvidia
    volumes:
      - coqui_models:/root/.local/share/tts
      - ../agents/tts/references:/references:ro
    ports: !reset []

  api-educational:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-educational
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - envs/cloudflare.env
    networks:
      - educational-network-dev
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  ollama_models:
    driver: local
  coqui_models:
    driver: local

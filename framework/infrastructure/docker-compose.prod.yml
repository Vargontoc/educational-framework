services:
  # Production overrides: keep Ollama internal, expose only required app ports elsewhere
  ollama-educational:
    deploy:
      restart_policy:
        condition: on-failure
    # Fallback for GPU access in environments where device_requests is unsupported
    runtime: nvidia
    volumes:
      - ollama_models:/models

  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
  ollama_models:
    driver: local

services:
  ollama-educational:
    deploy:
      restart_policy:
        condition: on-failure
    runtime: nvidia
    volumes:
      - ollama_models:/models
    ports: !reset []

  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: !reset []

  coqui-educational:
    runtime: nvidia
    volumes:
      - coqui_models:/root/.local/share/tts
      - ../agents/tts/references:/references:ro
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-educational
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - envs/cloudflare.env
    networks:
      - educational-network-dev
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  ollama_models:
    driver: local
  coqui_models:
    driver: local

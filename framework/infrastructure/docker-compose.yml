services:
  ollama-educational:
    image: ollama/ollama:latest
    container_name: ollama-educational
    env_file:
      - envs/ollama.env
    environment:
      # Enable GPU usage in the container if set in env file
      - OLLAMA_USE_GPU=${OLLAMA_USE_GPU:-false}
      - OLLAMA_GPU_DEVICES=${OLLAMA_GPU_DEVICES:-all}
    networks:
      - educational-network-dev
    restart: unless-stopped
    # GPU access: use Docker device_requests where supported, otherwise
    # fallback to the legacy runtime field. If your Docker Compose
    # installation rejects `device_requests`, use `runtime: nvidia`.
    runtime: nvidia
    volumes:
      - ollama_models:/models
    # Do NOT publish Ollama port to the host in development by default
    # Expose only to the docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    container_name: edu-postgres
    env_file:
      - envs/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - educational-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu} -d ${POSTGRES_DB:-edu_db}"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  ollama_models:

networks:
  educational-network-dev:
    name: educational-network-dev
    driver: bridge

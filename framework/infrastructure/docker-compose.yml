services:
  ollama-educational:
    build:
      context: ../agents
      dockerfile: Dockerfile
    image: educational-framework/ollama-educational:local
    container_name: ollama-educational
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - educational-network
    env_file:
      - envs/ollama-educational.env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local

networks:
  educational-network:
    name: educational-network
    driver: bridge

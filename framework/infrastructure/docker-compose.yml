services:
  ollama-educational:
    image: ollama/ollama:latest
    container_name: ollama-educational
    env_file:
      - envs/ollama.env
    environment:
      # Enable GPU usage in the container if set in env file
      - OLLAMA_USE_GPU=${OLLAMA_USE_GPU:-false}
      - OLLAMA_GPU_DEVICES=${OLLAMA_GPU_DEVICES:-all}
    networks:
      - educational-network-dev
    ports:
     - "11435:11434"
    deploy:
      restart_policy:
        condition: on-failure

    restart: unless-stopped
    # GPU access: use Docker device_requests where supported, otherwise
    # fallback to the legacy runtime field. If your Docker Compose
    # installation rejects `device_requests`, use `runtime: nvidia`.
    runtime: nvidia
    volumes:
      - ollama_models:/models
    # Do NOT publish Ollama port to the host in development by default
    # Expose only to the docker network
    healthcheck:
      test: ["CMD", "/bin/ollama", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    container_name: edu-postgres
    env_file:
      - envs/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - educational-network-dev
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu} -d ${POSTGRES_DB:-edu_db}"]
      interval: 30s
      timeout: 10s
      retries: 5

  coqui-educational:
    image: ghcr.io/coqui-ai/tts
    command: --model_name tts_models/multilingual/multi-dataset/xtts_v2 --language_idx es --use_cuda true
    container_name: coqui-educational
    env_file:
      - envs/coqui.env
    networks:
      - educational-network-dev
    ports:
      - "5002:5002"
    runtime: nvidia
    volumes:
      - coqui_models:/root/.local/share/tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  pgdata:
  ollama_models:
  coqui_models:

networks:
  educational-network-dev:
    name: educational-network-dev
    driver: bridge

services:
  ollama-educational:
    image: ollama/ollama:latest
    env_file:
      - envs/ollama.env
    environment:
      # Enable GPU usage in the container if set in env file
      - OLLAMA_USE_GPU=${OLLAMA_USE_GPU:-false}
      - OLLAMA_GPU_DEVICES=${OLLAMA_GPU_DEVICES:-all}
    networks:
      - educational-network-dev
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:${OLLAMA_HOST_PORT:-11434}:11434"
    deploy:
      restart_policy:
        condition: on-failure

    restart: unless-stopped
    # GPU access: use Docker device_requests where supported, otherwise
    # fallback to the legacy runtime field. If your Docker Compose
    # installation rejects `device_requests`, use `runtime: nvidia`.
    runtime: nvidia
    volumes:
      - ollama_models:/models
    # Do NOT publish Ollama port to the host in development by default
    # Expose only to the docker network
    healthcheck:
      test: ["CMD", "/bin/ollama", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-educational:
    image: postgres:latest
    env_file:
      - envs/postgres.env
    environment:
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - pgdata_educational:/var/lib/postgresql/data
    networks:
      - educational-network-dev
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api-educational:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: api-educational:latest
    env_file:
      - envs/backend.env
    networks:
      - educational-network-dev
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres-educational:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  coqui-educational:
    image: ghcr.io/coqui-ai/tts
    entrypoint: ["python3", "/root/TTS/server/server.py"]
    command: ["--model_path", "/root/.local/share/tts/tts_models--multilingual--multi-dataset--xtts_v2", "--config_path", "/root/.local/share/tts/tts_models--multilingual--multi-dataset--xtts_v2/config.json", "--use_cuda", "false", "--port", "5002"]
    env_file:
      - envs/coqui.env
    environment:
      # Auto-accept Coqui license in non-interactive container environment.
      # By setting this you confirm you have read and agree to the CPML:
      # https://coqui.ai/cpml
      - COQUI_TOS_AGREED=1
    networks:
      - educational-network-dev
    ports:
      - "${COQUI_BIND_IP:-127.0.0.1}:${COQUI_HOST_PORT:-5002}:5002"
    
    volumes:
      - coqui_models:/root/.local/share/tts
      - ../agents/tts/references:/references:ro
      - ./patches/server.py:/root/TTS/server/server.py:ro
      - ./patches/xtts.py:/root/TTS/tts/models/xtts.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app-educational:
    build:
      context: ../frontend/app
      dockerfile: Dockerfile
    image: app-educational:latest
    env_file:
      - envs/frontend.env
    networks:
      - educational-network-dev
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      api-educational:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  pgdata_educational:
  ollama_models:
  coqui_models:

networks:
  educational-network-dev:
    driver: bridge

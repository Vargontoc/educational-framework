name: CI — Infrastructure

on:
  push:
    branches:
      - 'framework/infrastructure/**'
    paths:
      - 'framework/infrastructure/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'framework/infrastructure/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax (local)
        working-directory: framework/infrastructure
        run: |
          docker compose config --quiet

      - name: Validate docker-compose syntax (prod override)
        working-directory: framework/infrastructure
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Verify no real .env files were committed
        working-directory: framework/infrastructure
        run: |
          # Fail if any tracked .env files exist under envs/ (excluding .example)
          if git ls-files 'framework/infrastructure/envs/*.env' | grep -v '\.example' | grep -q '.'; then
            echo "ERROR: real .env file detected in repository under framework/infrastructure/envs/"
            echo "Only .env.example files should be committed"
            git ls-files 'framework/infrastructure/envs/*.env' | grep -v '\.example' || true
            exit 1
          fi
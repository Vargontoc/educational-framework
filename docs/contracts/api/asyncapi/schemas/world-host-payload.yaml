description: Host information for a world destination.
type: object
required:
  - id
  - code
  - displayName
properties:
  id:
    type: integer
    format: int64
    description: Host identifier.
  code:
    type: string
    description: Host code identifier.
  displayName:
    type: string
    description: Human-readable host name.
  visualAssetKey:
    type: string
    description: Visual asset key for the host. Null if no asset is configured.
    nullable: true
  worldWidth:
    type: integer
    description: Logical pixel width of the host's world, used by the frontend to compute layout bounds. Null falls back to an application-level default.
    nullable: true

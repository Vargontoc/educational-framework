description: Payload containing game state. Returned by GAME_STARTED, GAME_READY, GAME_ABANDONED, and within GAME_ACTION_RESULT.
type: object
properties:
  gameId:
    type: integer
    format: int64
  status:
    type: string
    enum:
      - WAITING
      - STARTING
      - IN_PROGRESS
      - COMPLETED
      - ABANDONED
  activityId:
    type: integer
    format: int64
  difficultyLevelId:
    type: integer
    format: int64
  currentScore:
    type: number
  currentStreak:
    type: integer
  attempts:
    type: integer
  startedAt:
    type: string
    format: date-time
  completedAt:
    type: string
    format: date-time
  engine:
    type: string
    enum:
      - RECOGNITION
      - MEMORY
    description: >-
      Engine type running the game session. Only present when an engine is assigned. RECOGNITION games carry
      recognitionState; MEMORY games carry memoryState. For MEMORY, attempts counts the pairs of cards turned so
      far; it is not a child-facing value and must not be shown as a failure counter.
  starsEarned:
    type: integer
    description: Child-facing completion result (0-3 stars). Present when the game assigns a star rating.
  recognitionState:
    type: object
    description: >-
      Child-facing recognition round state. Only present when engine is RECOGNITION.
      Internal tracking fields (candidateElementIds, attempt counters, response times,
      pendingDifficultyLevel) are intentionally excluded.
    properties:
      recognitionCategory:
        type: string
        enum:
          - LETTER
          - NUMBER
          - SHAPE
          - COLOR
          - ANIMAL
          - COMPARISON
      roundIndex:
        type: integer
        description: Zero-based index of the current round.
      totalRounds:
        type: integer
        description: Total rounds required to complete the game.
      targetElementId:
        type: string
        description: Identifier of the target element the child must recognise.
      optionIds:
        type: array
        items:
          type: string
        description: Identifiers of the option elements shown for the current round.
      hintActive:
        type: boolean
        description: Whether the hint is currently active for the round.
      guideChromEnabled:
        type: boolean
        description: Whether the permanent visual guide chrome should be shown for this round's difficulty tier.
      touchEnableDelayMs:
        type: integer
        description: Milliseconds to wait before enabling touch input on the options, per the round's difficulty tier.
      nonChromaticKeyRequired:
        type: boolean
        description: >-
          Whether options must render a non-hue cue (pattern/texture) in addition to colour, because the category
          is COLOR and the child profile has a configured colour vision preference other than NONE.
      showIcon:
        type: boolean
        description: >-
          Whether the reference icon (resourceRefs.icon of the elements) should be shown for this round. true in
          EASY and MEDIUM, false in HARD. Only meaningful for the COLOR category; other categories may ignore it.
      comparisonMode:
        type: boolean
        description: >-
          true when the round is a big/small comparison (category COMPARISON, ADR-029): every option is the same
          element drawn at a different size and the child must pick the biggest. false otherwise; payloads that
          do not carry the field are recognition rounds.
      comparisonOptions:
        type: array
        description: >-
          Options of the current round with their relative size. Only present when comparisonMode is true.
          Every entry carries the same elementId (the target), so the options are told apart by scalePercent.
          EASY: 100 and 40; MEDIUM: 100 and 65; HARD: 100, 75 and 50. The order is shuffled every round.
          To answer, the client sends selectedScalePercent of the chosen option (see GameActionMessage).
        items:
          type: object
          required:
            - elementId
            - scalePercent
          properties:
            elementId:
              type: string
              description: Element shown; identical for every option of the round.
            scalePercent:
              type: number
              description: Relative size of the option (100, 75, 65, 50 or 40).
      elements:
        type: array
        description: >-
          Metadata for each element referenced in targetElementId and optionIds.
          Allows the client to render the round without a separate fetch.
          Only present when engine is RECOGNITION and element IDs are resolvable.
        items:
          type: object
          properties:
            id:
              type: string
              description: Element identifier (matches targetElementId/optionIds values).
            code:
              type: string
              description: Machine-readable code (e.g. "letter_a").
            displayValue:
              type: string
              description: Human-readable display value (e.g. "A").
            resourceRefs:
              type: object
              description: >-
                Opaque JSON object with media references (e.g. {"audio":"tts://letter_a","image":"img://letter_a"}).
                Structure is content-defined; client should handle missing keys gracefully. COLOR elements also
                carry "color" (hex code used for similarity validation) and "icon" (name of the reference icon,
                resolved to an asset by the client; see showIcon).
            accessibleColor:
              type: object
              description: >-
                Accessible color rendering data, already resolved server-side for the child's
                colorVisionMode preference. Only present for COLOR category elements linked to an
                AccessibleColor (accessible_color / accessible_color_palette tables). Client must not
                derive color or shape from resourceRefs/code for COLOR elements when this is present;
                this is the single source of truth for accessible rendering.
              properties:
                value:
                  type: string
                  description: >-
                    Accessible color value for the resolved colorVisionMode (hex string like "#FF0000",
                    or the literal "GRAY" for fully achromatic modes).
                shapeIcon:
                  type: string
                  description: Non-chromatic shape differentiator (e.g. "circle", "square", "triangle", "star").
                labelKey:
                  type: string
                  description: i18n label key for the accessible color variant.
              required:
                - value
                - shapeIcon
                - labelKey
          required:
            - id
    required:
      - roundIndex
      - totalRounds
      - hintActive
      - guideChromEnabled
      - touchEnableDelayMs
      - nonChromaticKeyRequired
      - showIcon
  memoryState:
    type: object
    description: >-
      Child-facing memory board. Only present when engine is MEMORY. The element of a card is only sent while the
      card is face up or matched (a face-down card does not disclose what is under it); `elements` describes every
      element of the board, without saying where each one is, so the client can load their images. Internal fields
      (attempt buffer, counters, response times, first-try data) are intentionally excluded.
      The client draws this state: it turns back a non-matching pair on its own after flipBackDelayMs (neutral, no
      failure feedback) and the server applies that turn-back with the next action.
    properties:
      rows:
        type: integer
      columns:
        type: integer
      totalPairs:
        type: integer
      matchedPairs:
        type: integer
        description: Pairs found so far. Matched cards stay face up until the game ends.
      flipBackDelayMs:
        type: integer
        description: Time a non-matching pair stays face up before turning back (EASY 2000, MEDIUM 1500, HARD 1000).
      waitingForFlipBack:
        type: boolean
        description: True while a non-matching pair is on show.
      flipBackCardIds:
        type: array
        description: Cards of the non-matching pair on show; empty when waitingForFlipBack is false.
        items:
          type: string
      cards:
        type: array
        items:
          type: object
          properties:
            cardId:
              type: string
              description: Id the client sends in the game_action (e.g. "card-3").
            row:
              type: integer
            column:
              type: integer
            faceUp:
              type: boolean
            matched:
              type: boolean
            elementId:
              type: string
              nullable: true
              description: Element of the card. Null while the card is face down.
          required:
            - cardId
            - row
            - column
            - faceUp
            - matched
      elements:
        type: array
        description: >-
          Every element of the board (id, code, displayValue, resourceRefs). The image to draw is
          resourceRefs.image (falling back to code). Not tied to any card position.
        items:
          type: object
          properties:
            id:
              type: string
            code:
              type: string
            displayValue:
              type: string
            resourceRefs:
              type: object
              additionalProperties: true
          required:
            - id
    required:
      - rows
      - columns
      - totalPairs
      - matchedPairs
      - flipBackDelayMs
      - waitingForFlipBack
      - cards

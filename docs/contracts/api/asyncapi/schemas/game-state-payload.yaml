description: Payload containing game state. Returned by GAME_STARTED, GAME_READY, GAME_ABANDONED, and within GAME_ACTION_RESULT.
type: object
properties:
  gameId:
    type: integer
    format: int64
  status:
    type: string
    enum:
      - WAITING
      - STARTING
      - IN_PROGRESS
      - COMPLETED
      - ABANDONED
  activityId:
    type: integer
    format: int64
  difficultyLevelId:
    type: integer
    format: int64
  currentScore:
    type: number
  currentStreak:
    type: integer
  attempts:
    type: integer
  startedAt:
    type: string
    format: date-time
  completedAt:
    type: string
    format: date-time
  engine:
    type: string
    enum:
      - RECOGNITION
      - MEMORY
    description: Engine type running the game session. Only present when an engine is assigned.
  starsEarned:
    type: integer
    description: Child-facing completion result (0-3 stars). Present when the game assigns a star rating.
  recognitionState:
    type: object
    description: >-
      Child-facing recognition round state. Only present when engine is RECOGNITION.
      Internal tracking fields (candidateElementIds, attempt counters, response times,
      pendingDifficultyLevel) are intentionally excluded.
    properties:
      recognitionCategory:
        type: string
        enum:
          - LETTER
          - NUMBER
          - SHAPE
          - COLOR
          - ANIMAL
      roundIndex:
        type: integer
        description: Zero-based index of the current round.
      totalRounds:
        type: integer
        description: Total rounds required to complete the game.
      targetElementId:
        type: string
        description: Identifier of the target element the child must recognise.
      optionIds:
        type: array
        items:
          type: string
        description: Identifiers of the option elements shown for the current round.
      hintActive:
        type: boolean
        description: Whether the hint is currently active for the round.
      elements:
        type: array
        description: >-
          Metadata for each element referenced in targetElementId and optionIds.
          Allows the client to render the round without a separate fetch.
          Only present when engine is RECOGNITION and element IDs are resolvable.
        items:
          type: object
          properties:
            id:
              type: string
              description: Element identifier (matches targetElementId/optionIds values).
            code:
              type: string
              description: Machine-readable code (e.g. "letter_a").
            displayValue:
              type: string
              description: Human-readable display value (e.g. "A").
            resourceRefs:
              type: object
              description: >-
                Opaque JSON object with media references (e.g. {"audio":"tts://letter_a","image":"img://letter_a"}).
                Structure is content-defined; client should handle missing keys gracefully.
          required:
            - id
    required:
      - roundIndex
      - totalRounds
      - hintActive

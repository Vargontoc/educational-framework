name: GameActionResponse
description: Result of a processed game action. Sent after a GameActionMessage is processed by the orchestrator.
payload:
  type: object
  required:
    - event
    - sessionId
    - payload
  properties:
    event:
      type: string
      const: GAME_ACTION_RESULT
    sessionId:
      type: integer
      format: int64
    payload:
      type: object
      properties:
        resultType:
          type: string
          enum:
            - CORRECT
            - INCORRECT
            - TIMEOUT
          description: Normalized result of the action.
        updatedState:
          $ref: "../schemas/websocket/game-state-payload.yaml"
          description: Current game state after the action was applied.
        difficultyChanged:
          type: boolean
          description: True when difficulty level was adjusted by adaptive difficulty service.
        newDifficultyLevelId:
          type: integer
          format: int64
          description: New difficulty level ID. Present when difficultyChanged is true.
        gameCompleted:
          type: boolean
          description: True when this action completed the game.
        unlockedAchievements:
          type: array
          items:
            type: object
            properties:
              achievementCode:
                type: string
              activityId:
                type: integer
                format: int64
              topicId:
                type: integer
                format: int64
          description: Achievements unlocked by this action. Contains achievementCode, activityId, and topicId.
        attemptContext:
          type: string
          description: >-
            Contextual info about the attempt, a JSON string. RECOGNITION: recognitionCategory, roundIndex,
            targetElementId, selectedOptionId, optionIds, firstTry, hintActive, attemptNumberInRound, responseTimeMs.
            MEMORY (engineType MEMORY): event (FIRST_FLIP | MATCH | MISMATCH | IGNORED), memoryCategory (shared
            thematic group of the board, MIXED when several), cardId1, cardId2 (null until the pair is complete),
            elementId (only for a MATCH), match, attemptNumber, responseTimeMs, firstTry. In MEMORY, resultType is
            CORRECT for FIRST_FLIP, MATCH and IGNORED, and INCORRECT for a MISMATCH: it is a technical value and must
            not be shown to the child as a failure (ADR-030: no negative sound, no shake, no failure counter).
            Only MATCH and MISMATCH are attempts; they are buffered on the server and registered in tracking when
            the game completes, never before (an abandoned or discarded game registers no attempts).

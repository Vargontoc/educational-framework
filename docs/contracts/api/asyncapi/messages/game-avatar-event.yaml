name: GameAvatarEvent
description: Avatar audio event sent to game client. JSON metadata frame, optionally followed by a binary audio frame correlated by audioId.
payload:
  type: object
  required:
    - event
    - sessionId
    - eventType
    - audioAvailable
    - text
  properties:
    event:
      type: string
      const: GAME_AVATAR_EVENT
    sessionId:
      type: integer
      format: int64
    eventType:
      type: string
      enum:
        - WELCOME
        - FAREWELL
        - BIOME_TRANSITION
        - ROUND_PROMPT
      description: >-
        Lifecycle subtype. WELCOME: welcome after auth. FAREWELL: farewell before backend-initiated close.
        BIOME_TRANSITION: avatar narration when the child travels to a new biome. ROUND_PROMPT: Nubi's prompt for
        the round (RECOGNITION: once per round, after GAME_READY and after each correct answer; MEMORY: once per
        game, after GAME_READY, taken from the nubi-audio of the first card's element). It is only sent when audio
        is available and always after the state event, so the game can be drawn and played without it.
    audioAvailable:
      type: boolean
      description: True when audio binary frame will follow.
    audioId:
      type: string
      format: uuid
      description: Correlation ID for the following binary audio frame. Present only when audioAvailable is true.
    text:
      type: string
      description: Fallback text. Always present regardless of audio availability.

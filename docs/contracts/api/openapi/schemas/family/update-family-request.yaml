type: object
additionalProperties: false

properties:
  name:
    type: string
  pin:
    type: string
    pattern: '^\d{4}$'
  audioGeneralEnabled:
    type: boolean
  audioGeneralVolume:
    type: integer
    minimum: 0
    maximum: 100
  npcEnabled:
    type: boolean
  npcVoiceEnabled:
    type: boolean
  npcVoiceVolume:
    type: integer
    minimum: 0
    maximum: 100
  narrativeVoiceEnabled:
    type: boolean
  narrativeVoiceVolume:
    type: integer
    minimum: 0
    maximum: 100

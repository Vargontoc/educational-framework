type: object
additionalProperties: false

properties:
  id:
    type: integer
    format: int64
  familyId:
    type: integer
    format: int64
  name:
    type: string
  active:
    type: boolean
  birthday:
    type: string
    format: date
  avatar:
    type: string
  npcVoiceEnabled:
    type: boolean
  npcEnabled:
    type: boolean
  npcVoiceVolume:
    type: integer
    minimum: 0
    maximum: 100
  colorVisionMode:
    type: string
    enum:
      - NONE
      - PROTANOPIA
      - PROTANOMALY
      - DEUTERANOMALY
      - DEUTERANOPIA
      - TRITANOPIA
      - TRITANOMALY
      - ACHROMATOMALY
      - ACHROMATOPSIA
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time

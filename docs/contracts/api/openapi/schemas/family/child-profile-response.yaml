type: object
additionalProperties: false

properties:
  id:
    type: integer
    format: int64
  familyId:
    type: integer
    format: int64
  name:
    type: string
  active:
    type: boolean
  birthday:
    type: string
    format: date
  avatar:
    type: string
  ttsEnabled:
    type: boolean
  agentEnabled:
    type: boolean
  colorVisionMode:
    type: string
    enum:
      - NONE
      - PROTANOPIA
      - DEUTERANOMALY
      - DEUTERANOPIA
      - TRITANOPIA
      - ACHROMATOPSIA
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time

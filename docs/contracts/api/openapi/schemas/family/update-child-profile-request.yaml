type: object
additionalProperties: false

properties:
  name:
    type: string
  birthday:
    type: string
    format: date
  avatar:
    type: string
  ttsEnabled:
    type: boolean
  agentEnabled:
    type: boolean
  colorVisionMode:
    type: string
    enum:
      - NONE
      - PROTANOPIA
      - DEUTERANOMALY
      - DEUTERANOPIA
      - TRITANOPIA
      - ACHROMATOPSIA

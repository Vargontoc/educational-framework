openapi: 3.1.0
info: 
  title: Educational Framework API 
  version: 1.0.0

servers:
  - url: /api/v1

paths:

  /auth/login:
    post:
      $ref: "./paths/login.yaml"
  /auth/logout:
    post:
      $ref: "./paths/logout.yaml"

  /family:
    get:
      $ref: "./paths/family/get-family.yaml"
    post:
      $ref: "./paths/family/create-family.yaml"
    patch:
      $ref: "./paths/family/patch-family.yaml"
  
  /family/children/activation/{id}:
    put:
      $ref: "./paths/family/activate-children.yaml"
  /family/children:
    get:
      $ref: "./paths/family/get-childrens.yaml"
    post:
      $ref: "./paths/family/create-children.yaml"
  /family/children/{id}:
    get:
      $ref: "./paths/family/get-children.yaml"
    delete:
      $ref: "./paths/family/delete-children.yaml"
    patch:
      $ref: "./paths/family/update-children.yaml"

  /family/adults:
    get:
      $ref: "./paths/family/get-adults.yaml"
    post:
      $ref: "./paths/family/create-adult.yaml"
  /family/adults/{id}:
    get:
      $ref: "./paths/family/get-adult.yaml"
    delete:
      $ref: "./paths/family/delete-adult.yaml"
    patch:
      $ref: "./paths/family/update-adult.yaml"

  /sessions/children:
    get:
      $ref: "./paths/session/get-session-children.yaml"
    post:
      $ref: "./paths/session/create-session-children.yaml"
  /sessions/children/{id}:
    delete:
      $ref: "./paths/session/delete-session-children.yaml"
  /sessions/children/{id}/expel:
    delete:
      $ref: "./paths/session/expel-session-children.yaml"
  /sessions/children/{id}/heartbeat:
    post:
      $ref: "./paths/session/heartbeat-session-children.yaml"


  /dev/content/tracing-patterns:
    get:
      $ref: "./paths/content/get-tracing-patterns.yaml"
    post:
      $ref: "./paths/content/create-tracing-pattern.yaml"
  /dev/content/tracing-patterns/{id}:
    get:
      $ref: "./paths/content/get-tracing-pattern.yaml"
    put:
      $ref: "./paths/content/update-tracing-pattern.yaml"

  /dev/content/topics:
    get:
      $ref: "./paths/content/get-topics.yaml"
    post:
      $ref: "./paths/content/create-topic.yaml"
  /dev/content/topics/{id}:
    get:
      $ref: "./paths/content/get-topic.yaml"
    put:
      $ref: "./paths/content/update-topic.yaml"
  
  /dev/content/stories:
    get:
      $ref: "./paths/content/get-stories.yaml"
    post:
      $ref: "./paths/content/create-stories.yaml"
  /dev/content/stories/{id}:
    get:
      $ref: "./paths/content/get-story.yaml"
    put:
      $ref: "./paths/content/update-story.yaml"
  /dev/content/stories/{storyId}/pages:
    get:
      $ref: "./paths/content/get-pages.yaml"
    post:
      $ref: "./paths/content/create-pages.yaml"
  /dev/content/stories/{storyId}/pages/{pageId}:
    get:
      $ref: "./paths/content/get-page.yaml"
    put:
      $ref: "./paths/content/update-page.yaml"
  
  /dev/content/locales:
    get:
      $ref: "./paths/content/get-locales.yaml"
    post:
      $ref: "./paths/content/create-locales.yaml"
  /dev/content/locales/{id}:
    put:
      $ref: "./paths/content/update-locale.yaml"
  
  /dev/content/learning-paths:
    get:
      $ref: "./paths/content/get-learning-paths.yaml"
    post:
      $ref: "./paths/content/create-learning-path.yaml" 
  /dev/content/learning-paths/{id}:
    get:
      $ref: "./paths/content/get-learning-path.yaml"
    put:
      $ref: "./paths/content/update-learning-path.yaml"
  
  /dev/content/learning-paths/{learningPathId}/steps:
    get:
      $ref: "./paths/content/get-learning-paths-steps.yaml"

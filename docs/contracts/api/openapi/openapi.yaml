      $ref: "./paths/content/create-learning-path-step.yaml" 
  /dev/content/learning-paths/{learningPathId}/steps/{stepId}:
    get:
      $ref: "./paths/content/get-learning-path-step.yaml"
    put:
      $ref: "./paths/content/update-learning-path-step.yaml"
      
  /dev/content/difficulty-levels:
    get:
      $ref: "./paths/content/get-difficulty-levels.yaml"
    post:
      $ref: "./paths/content/create-difficulty-levels.yaml"
  /dev/content/difficulty-levels/{id}:
    put:
      $ref: "./paths/content/update-difficulty-level.yaml"
  
  /dev/content/curiosities:
    get:
      $ref: "./paths/content/get-curiosities.yaml"
    post:
      $ref: "./paths/content/create-curiosity.yaml"
  /dev/content/curiosities/{id}:
    get:
      $ref: "./paths/content/get-cutiosity.yaml"
    put:
      $ref: "./paths/content/update-curiosity.yaml"
  
  /dev/content/categories:
    get:
      $ref: "./paths/content/get-categories.yaml"
    post:
      $ref: "./paths/content/create-category.yaml"
  /dev/content/categories/{id}:
    get:
      $ref: "./paths/content/get-category.yaml"
    put:
      $ref: "./paths/content/update-category.yaml"

  /dev/content/avatar-events:
    get:
      $ref: "./paths/content/get-avatar-events.yaml"
    post:
      $ref: "./paths/content/create-avatar-event.yaml"
  /dev/content/avatar-events/{id}:
    get:
      $ref: "./paths/content/get-avatar-event.yaml"
    put:
      $ref: "./paths/content/update-avatar-event.yaml"

  /dev/content/activities:
    get:
      $ref: "./paths/content/get-activities.yaml"
    post:
      $ref: "./paths/content/create-activity.yaml"
  /dev/content/activities/{id}:
    get:
      $ref: "./paths/content/get-activity.yaml"
    put:
      $ref: "./paths/content/update-activity.yaml"

  /dev/content/activity-resources:
    get:
      $ref: "./paths/content/get-activity-resources.yaml"
    post:
      $ref: "./paths/content/create-activity-resource.yaml"
  /dev/content/activity-resources/{id}:
    put:
      $ref: "./paths/content/update-activity-resource.yaml"

  /content/stories:
    get:
      $ref: "./paths/content/list-active-stories.yaml"
  /content/stories/{id}:
    get:
      $ref: "./paths/content/get-story-detail.yaml"

  /tracking/children/{childProfileId}/topics:
    get:
      $ref: "./paths/tracking/topics.yaml"  
  /tracking/children/{childProfileId}/summary:
    get:
      $ref: "./paths/tracking/summary.yaml"  
  /tracking/children/{childProfileId}/response-time:
    get:
      $ref: "./paths/tracking/response-time.yaml"  
  /tracking/children/{childProfileId}/learning-progress:
    get:
      $ref: "./paths/tracking/learning-progress.yaml"  
  /tracking/children/{childProfileId}/engagement:
    get:
      $ref: "./paths/tracking/engagement.yaml"  
  /tracking/children/{childProfileId}/difficulty:
    get:
      $ref: "./paths/tracking/difficulty.yaml"  
  /tracking/children/{childProfileId}/activities:
    get:
      $ref: "./paths/tracking/activities.yaml"  
  /tracking/children/{childProfileId}/achievements:
    get:
      $ref: "./paths/tracking/achievements.yaml"
name: educational-framework
services:

  tts:
    build:
      context: ./framework/tts
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - educational-network
    ports:
      - "${TTS_BIND_IP:-127.0.0.1}:${TTS_HOST_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  api:
    build:
      context: ./framework/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - educational-network
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  app:
    build:
      context: ./framework/frontend/app
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - educational-network
    expose:
      - "${FRONTEND_EXPOSE_PORT:-80}"
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-educational
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:80"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - educational-network
    restart: unless-stopped

networks:
  educational-network:
    driver: bridge